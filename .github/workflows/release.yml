# Every push to main builds the Windows installer and publishes it as a GitHub Release.
# Installed copies of Kata check these releases on launch and update themselves.
#
# Needs one repository secret: TAURI_SIGNING_PRIVATE_KEY (the contents of ~/.tauri/kata.key on the
# PC that set this up). Installed apps only accept updates signed with that key.
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'apps/sound-lab/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --no-frozen-lockfile

      # Each run gets a higher version (1.0.<run number>) so installed apps see it as an update,
      # and produces the signed update files (local builds skip them, so they need no key).
      - name: Set version
        shell: bash
        run: |
          node -e "
            const f = 'apps/desktop/src-tauri/tauri.conf.json';
            const c = JSON.parse(require('fs').readFileSync(f, 'utf8'));
            c.version = '1.0.${{ github.run_number }}';
            c.bundle.createUpdaterArtifacts = true;
            require('fs').writeFileSync(f, JSON.stringify(c, null, 2));
          "

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          projectPath: apps/desktop
          tagName: v1.0.${{ github.run_number }}
          releaseName: Kata 1.0.${{ github.run_number }}
          releaseBody: Built from ${{ github.sha }}. Installed copies of Kata update themselves.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
